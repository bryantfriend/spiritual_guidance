<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Practitioner Dashboard | Spiritual Guidance</title>
    <link rel="stylesheet" href="app/styles/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="container dashboard-header">
        <div class="user-profile-summary">
            <div class="avatar-container">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=spiritual" alt="Profile" id="dashboard-avatar">
                <button class="edit-avatar"><i data-lucide="camera"></i></button>
            </div>
            <div class="user-info">
                <h2 id="practitioner-name">Aura Mystic</h2>
                <p id="practitioner-role">Energy Healer</p>
            </div>
        </div>
    </header>

    <main id="app" class="container">
        <!-- Dashboard Tabs -->
        <div class="dashboard-tabs">
            <button class="tab-btn active" data-tab="profile">Profile</button>
            <button class="tab-btn" data-tab="services">Services</button>
            <button class="tab-btn" data-tab="bookings">Bookings</button>
        </div>

        <section id="tab-content" class="tab-content">
            <!-- Profile Tab (Default) -->
            <div class="tab-pane active" id="profile-pane">
                <div class="glass-card">
                    <h3>About You</h3>
                    <div class="form-group">
                        <label>Bio</label>
                        <textarea id="practitioner-bio" placeholder="Tell your story..."></textarea>
                    </div>
                    <button class="btn btn-primary" id="save-profile">Save Changes</button>
                </div>
            </div>

            <!-- Bookings Tab -->
            <div class="tab-pane" id="bookings-pane" style="display: none;">
                <div class="bookings-header">
                    <h3>Incoming Requests</h3>
                </div>
                <div id="practitioner-bookings-list" class="booking-list">
                    <p class="empty-state">No booking requests yet.</p>
                </div>
            </div>

            <!-- Services Tab -->
            <div class="tab-pane" id="services-pane" style="display: none;">
                <div class="services-header">
                    <h3>Your Offerings</h3>
                    <button class="btn-icon" id="open-add-service"><i data-lucide="plus"></i></button>
                </div>
                <div id="dashboard-services-list" class="service-list">
                    <!-- Services will be listed here -->
                     <p class="empty-state">No services added yet.</p>
                </div>
            </div>

            <!-- Simple Add Service Modal (Hidden by default) -->
            <div id="add-service-modal" class="modal" style="display: none;">
                <div class="modal-content glass-card">
                    <div class="modal-header">
                        <h3>New Service</h3>
                        <button class="btn-icon" id="close-modal"><i data-lucide="x"></i></button>
                    </div>
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="service-title" placeholder="e.g. Tarot Reading">
                    </div>
                    <div class="form-group">
                        <label>Price ($)</label>
                        <input type="number" id="service-price" placeholder="50">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="service-desc" placeholder="What does this service include?"></textarea>
                    </div>
                    <button class="btn btn-primary" id="submit-service">Create Service</button>
                </div>
            </div>
        </section>
    </main>

    <style>
        .dashboard-header {
            padding: 32px 20px;
            background: linear-gradient(to bottom, var(--primary-dark), var(--background));
        }
        .user-profile-summary {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .avatar-container {
            position: relative;
        }
        .avatar-container img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            object-fit: cover;
        }
        .edit-avatar {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--accent);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--background);
        }
        
        .dashboard-tabs {
            display: flex;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 24px;
        }
        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            padding: 12px 16px;
            font-weight: 600;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            color: var(--primary-light);
            border-bottom-color: var(--primary-light);
        }
        
        #practitioner-bio {
            width: 100%;
            height: 120px;
            background: var(--surface-light);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: white;
            padding: 12px;
            font-family: inherit;
            resize: none;
            outline: none;
        }
        
        .services-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-icon {
            background: var(--surface-light);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
        }
        
        .service-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .dashboard-service-card {
            background: var(--surface);
            padding: 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            width: 100%;
            max-width: 400px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
        }
        
        /* Bottom Nav (same as others) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .nav-item.active {
            color: var(--primary-light);
        }
    </style>

    <script>lucide.createIcons();</script>
    <script type="module" src="app/pages/dashboard.js"></script>
</body>
</html>
