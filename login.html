<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login / Sign Up | Saikal</title>
    <link rel="stylesheet" href="app/styles/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container auth-container">
        <div class="auth-box glass-card">
            <h1>Welcome back</h1>
            <p>Continue your spiritual journey</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <div class="auth-footer">
                <p>New to Saikal? <a href="register.html">Sign up</a></p>
                <div class="divider"><span>OR</span></div>
                <button class="btn btn-outline" id="google-login">
                    <i data-lucide="mail"></i>
                    Continue with Google
                </button>
            </div>
        </div>
    </main>

    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding-bottom: 0;
        }
        .auth-box {
            width: 100%;
            text-align: center;
        }
        .auth-box h1 { margin-bottom: 8px; }
        .auth-box p { color: var(--text-muted); margin-bottom: 32px; }
        
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: white;
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--primary);
        }
        
        .auth-footer {
            margin-top: 24px;
        }
        .auth-footer p { font-size: 0.9rem; margin-bottom: 16px; }
        .auth-footer a { color: var(--primary-light); font-weight: 600; }
        
        .divider {
            position: relative;
            margin: 24px 0;
            height: 1px;
            background: var(--glass-border);
        }
        .divider span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface);
            padding: 0 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: white;
            gap: 10px;
        }
    </style>

    <script>lucide.createIcons();</script>
    <script type="module" src="app/pages/login.js"></script>
</body>
</html>
