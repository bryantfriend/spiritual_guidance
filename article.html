<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Article | Spiritual Guidance</title>
    <link rel="stylesheet" href="app/styles/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <button class="back-btn" onclick="history.back()" style="position: fixed; top: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);">
        <i data-lucide="chevron-left"></i>
    </button>

    <main id="article-content">
        <!-- Hero Image -->
        <div id="article-hero" style="height: 350px; width: 100%; position: relative;">
            <img src="" id="article-img" style="width: 100%; height: 100%; object-fit: cover;" alt="Article Image">
            <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(to top, var(--background), transparent);"></div>
        </div>

        <div class="container" style="margin-top: -60px; position: relative; z-index: 10;">
            <div class="glass-card" style="margin-bottom: 40px;">
                <h1 id="article-title" class="text-gradient">Loading Article...</h1>
                <div style="display: flex; gap: 12px; margin: 16px 0; font-size: 0.9rem; color: var(--text-muted);">
                    <span id="article-author"></span>
                    <span>•</span>
                    <span id="article-date"></span>
                </div>
                <div id="article-body" style="line-height: 1.8; font-size: 1.05rem;">
                    <!-- Article text -->
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="app/pages/article.js"></script>
</body>
</html>
